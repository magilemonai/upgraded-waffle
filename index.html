<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numinous</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    cursor: none;
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    -webkit-font-smoothing: antialiased;
  }

  canvas#cosmos {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 0;
  }

  #veil {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 100%);
  }

  #wisdom {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    text-align: center;
    max-width: min(80vw, 700px);
    pointer-events: none;
    opacity: 0;
    transition: opacity 3s ease-in-out;
  }

  #wisdom.visible { opacity: 1; }

  #wisdom .text {
    color: rgba(220, 210, 190, 0.9);
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    font-weight: 300;
    line-height: 1.8;
    letter-spacing: 0.04em;
    text-shadow: 0 0 40px rgba(180, 160, 120, 0.15);
  }

  #wisdom .source {
    color: rgba(160, 145, 120, 0.5);
    font-size: clamp(0.7rem, 1.5vw, 0.9rem);
    font-style: italic;
    font-weight: 300;
    margin-top: 2em;
    letter-spacing: 0.12em;
    text-transform: lowercase;
  }

  #cursor-glow {
    position: fixed;
    width: 200px; height: 200px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(200, 180, 140, 0.06) 0%,
      rgba(200, 180, 140, 0.02) 40%,
      transparent 70%
    );
    mix-blend-mode: screen;
    transition: opacity 0.5s;
  }

  #breathe {
    position: fixed;
    bottom: 3vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    color: rgba(160, 145, 120, 0.2);
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: lowercase;
    pointer-events: none;
    animation: breathe-text 8s ease-in-out infinite;
  }

  @keyframes breathe-text {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.4; }
  }

  #threshold {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 10;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 3s ease-out;
  }

  #threshold.dissolving {
    opacity: 0;
    pointer-events: none;
  }

  #threshold .enter-text {
    color: rgba(180, 165, 135, 0.4);
    font-size: clamp(0.8rem, 2vw, 1.1rem);
    letter-spacing: 0.25em;
    font-weight: 300;
    animation: pulse-soft 4s ease-in-out infinite;
    cursor: pointer;
  }

  @keyframes pulse-soft {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.7; }
  }
</style>
</head>
<body>

<div id="threshold">
  <span class="enter-text">enter the silence</span>
</div>

<canvas id="cosmos"></canvas>
<div id="veil"></div>
<div id="wisdom">
  <div class="text" id="wisdom-text"></div>
  <div class="source" id="wisdom-source"></div>
</div>
<div id="cursor-glow"></div>
<div id="breathe">be still</div>

<script>
// ─── The Fragments ───
// Drawn from the deep well of human contemplation across millennia.
// All texts are from public domain works and ancient oral traditions.

const fragments = [
  {
    text: "The Tao that can be told\nis not the eternal Tao.\nThe name that can be named\nis not the eternal name.",
    source: "Tao Te Ching, verse 1 — Laozi, 6th century BCE"
  },
  {
    text: "As the rivers flowing east and west\nmerge in the sea and become one with it,\nforgetting they were ever separate rivers,\nso do all creatures lose their separateness\nwhen they merge at last into pure being.",
    source: "Chandogya Upanishad — c. 800 BCE"
  },
  {
    text: "The soul is not born; it does not die.\nIt was not produced from anyone, nor was any produced from it.\nUnborn, eternal, it is not slain, though the body is slain.",
    source: "Katha Upanishad — c. 500 BCE"
  },
  {
    text: "Look at the stars lighting up the sky:\nno one of them stays in the same place.\nConsider how the sun at its rising\nis strong to pursue its path.",
    source: "Meditations — Marcus Aurelius, 2nd century CE"
  },
  {
    text: "Dwell on the beauty of life.\nWatch the stars,\nand see yourself running with them.",
    source: "Meditations — Marcus Aurelius, 2nd century CE"
  },
  {
    text: "I have been a word in a book.\nI have been a book originally.\nI have been a light in a lantern.\nI have been a bridge for passing\nover threescore rivers.",
    source: "Cad Goddeu — Welsh oral tradition, ancient"
  },
  {
    text: "I am the wind on the sea.\nI am the wave of the sea.\nI am the bull of seven battles.\nI am the eagle on the rock.\nI am a flash from the sun.\nI am the fairest of plants.",
    source: "Song of Amergin — Irish oral tradition, ancient"
  },
  {
    text: "Everything flows and nothing abides.\nEverything gives way and nothing stays fixed.",
    source: "Heraclitus — c. 500 BCE"
  },
  {
    text: "No man ever steps in the same river twice,\nfor it is not the same river\nand he is not the same man.",
    source: "Heraclitus — c. 500 BCE"
  },
  {
    text: "I am yesterday, today,\nand tomorrow.\nI have the power to be born a second time.\nI am the divine hidden soul\nwho creates the gods.",
    source: "Book of Coming Forth by Day — ancient Egypt, c. 1550 BCE"
  },
  {
    text: "The moon does not fight.\nIt attacks no one.\nIt does not worry.\nIt does not try to crush others.\nIt keeps to its course.\nBy its very nature,\nit gently influences.",
    source: "Deng Ming-Dao, after ancient Taoist teaching"
  },
  {
    text: "There is a thing inherent and natural,\nwhich existed before heaven and earth.\nMotionless and fathomless,\nit stands alone and never changes.\nIt pervades everywhere and never becomes exhausted.\nIt may be regarded as the Mother of the Universe.",
    source: "Tao Te Ching, verse 25 — Laozi, 6th century BCE"
  },
  {
    text: "In the beginning there was neither existence nor non-existence.\nAll this world was unmanifest energy.\nThe One breathed, without breath, by its own power.\nNothing else was there.",
    source: "Nasadiya Sukta, Rigveda — c. 1500 BCE"
  },
  {
    text: "If the doors of perception were cleansed,\neverything would appear to man as it is:\ninfinite.",
    source: "The Marriage of Heaven and Hell — William Blake, 1793"
  },
  {
    text: "To see a World in a Grain of Sand\nand a Heaven in a Wild Flower,\nhold Infinity in the palm of your hand\nand Eternity in an hour.",
    source: "Auguries of Innocence — William Blake, c. 1803"
  },
  {
    text: "When I heard the learn'd astronomer,\nwhen the proofs, the figures were ranged in columns before me,\nhow soon unaccountable I became tired and sick,\ntill rising and gliding out I wander'd off by myself,\nin the mystical moist night-air,\nand from time to time look'd up in perfect silence at the stars.",
    source: "Walt Whitman — Leaves of Grass, 1865"
  },
  {
    text: "We shall not cease from exploration\nand the end of all our exploring\nwill be to arrive where we started\nand know the place for the first time.",
    source: "T.S. Eliot — Four Quartets, 1942"
  },
  {
    text: "The wild geese do not intend\nto cast their reflection.\nThe water has no mind\nto receive their image.",
    source: "Zenrin Kushu — Japanese Zen anthology, 15th century"
  },
  {
    text: "Sitting quietly, doing nothing,\nspring comes,\nand the grass grows by itself.",
    source: "Zenrin Kushu — Japanese Zen anthology, 15th century"
  },
  {
    text: "Before the world was made,\nwhen it was only darkness and water,\na great wind swept over the deep.\nThen light was called forth,\nand light was.",
    source: "Genesis — Hebrew oral tradition, ancient"
  },
  {
    text: "The real voyage of discovery consists\nnot in seeking new landscapes,\nbut in having new eyes.",
    source: "Marcel Proust — In Search of Lost Time, 1913"
  },
  {
    text: "Fire is the origin of stone.\nBy the fire of the spirit,\nwhen deep within the furthest recess,\na precious jewel is found.",
    source: "Finnish oral tradition — after the Kalevala"
  },
  {
    text: "From the unreal, lead me to the real.\nFrom darkness, lead me to light.\nFrom death, lead me to immortality.",
    source: "Brihadaranyaka Upanishad — c. 700 BCE"
  },
  {
    text: "In the depth of winter,\nI finally learned that within me\nthere lay an invincible summer.",
    source: "Albert Camus — Return to Tipasa, 1954"
  },
  {
    text: "You are not a drop in the ocean.\nYou are the entire ocean in a drop.",
    source: "Rumi — 13th century"
  },
];

// ─── Cosmos (star field & nebulae) ───

const canvas = document.getElementById('cosmos');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  W /= devicePixelRatio;
  H /= devicePixelRatio;
}
window.addEventListener('resize', resize);
resize();

// Stars
const stars = [];
const STAR_COUNT = 600;
for (let i = 0; i < STAR_COUNT; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.2 + 0.2,
    brightness: Math.random(),
    speed: Math.random() * 0.0003 + 0.0001,
    phase: Math.random() * Math.PI * 2
  });
}

// Slow drifting nebula colors
function nebulaColor(t) {
  const cycle = t * 0.00003;
  const r = Math.sin(cycle) * 8 + 8;
  const g = Math.sin(cycle + 2) * 6 + 6;
  const b = Math.sin(cycle + 4) * 15 + 18;
  return `rgba(${r|0}, ${g|0}, ${b|0}, 0.4)`;
}

// Ripples from presence
const ripples = [];
let mouseX = W / 2, mouseY = H / 2;

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  document.getElementById('cursor-glow').style.left = mouseX + 'px';
  document.getElementById('cursor-glow').style.top = mouseY + 'px';
});

document.addEventListener('click', e => {
  if (document.getElementById('threshold').style.display !== 'none') return;
  ripples.push({ x: e.clientX, y: e.clientY, t: 0, maxR: 150 + Math.random() * 100 });
});

document.addEventListener('touchstart', e => {
  const touch = e.touches[0];
  ripples.push({ x: touch.clientX, y: touch.clientY, t: 0, maxR: 150 + Math.random() * 100 });
});

// ─── Render loop ───

let time = 0;

function draw() {
  time++;
  ctx.globalCompositeOperation = 'source-over';

  // Soft fade (trails)
  ctx.fillStyle = nebulaColor(time);
  ctx.fillRect(0, 0, W, H);

  // Deep background overlay
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {
    const flicker = Math.sin(time * s.speed * 60 + s.phase) * 0.4 + 0.6;
    const alpha = s.brightness * flicker * 0.8;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(235, 225, 205, ${alpha})`;
    ctx.fill();

    // Subtle glow on brighter stars
    if (s.r > 0.9) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 185, 155, ${alpha * 0.08})`;
      ctx.fill();
    }
  }

  // Ripples
  ctx.globalCompositeOperation = 'lighter';
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.t += 0.008;
    if (r.t >= 1) { ripples.splice(i, 1); continue; }
    const radius = r.maxR * r.t;
    const alpha = (1 - r.t) * 0.06;
    ctx.beginPath();
    ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(200, 185, 150, ${alpha})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Gentle mouse-follow glow on canvas
  ctx.globalCompositeOperation = 'lighter';
  const grd = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 120);
  grd.addColorStop(0, 'rgba(180, 165, 130, 0.015)');
  grd.addColorStop(1, 'rgba(180, 165, 130, 0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(draw);
}

// ─── Wisdom cycle ───

const wisdomEl = document.getElementById('wisdom');
const textEl = document.getElementById('wisdom-text');
const sourceEl = document.getElementById('wisdom-source');
let currentIndex = -1;
let wisdomQueue = [];

function shuffleQueue() {
  wisdomQueue = [...Array(fragments.length).keys()];
  // Fisher-Yates
  for (let i = wisdomQueue.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    [wisdomQueue[i], wisdomQueue[j]] = [wisdomQueue[j], wisdomQueue[i]];
  }
}

function showNextWisdom() {
  if (wisdomQueue.length === 0) shuffleQueue();
  const idx = wisdomQueue.pop();
  const frag = fragments[idx];

  wisdomEl.classList.remove('visible');

  setTimeout(() => {
    textEl.innerHTML = frag.text.replace(/\n/g, '<br>');
    sourceEl.textContent = '— ' + frag.source;

    setTimeout(() => {
      wisdomEl.classList.add('visible');
    }, 800);

    // Visible for 12-16 seconds, then fade
    const displayTime = 12000 + Math.random() * 4000;
    setTimeout(() => {
      wisdomEl.classList.remove('visible');
      // Wait for fade out, then show next
      setTimeout(showNextWisdom, 4000 + Math.random() * 3000);
    }, displayTime);
  }, 1000);
}

// ─── Threshold (entry) ───

document.getElementById('threshold').addEventListener('click', () => {
  const threshold = document.getElementById('threshold');
  threshold.classList.add('dissolving');
  setTimeout(() => {
    threshold.style.display = 'none';
    showNextWisdom();
  }, 3000);
});

// Also allow touch
document.getElementById('threshold').addEventListener('touchend', e => {
  e.preventDefault();
  document.getElementById('threshold').click();
});

// ─── Begin ───
draw();
</script>
</body>
</html>
