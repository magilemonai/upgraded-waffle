<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Numinous</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    font-family: 'Cormorant Garamond', 'Georgia', serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Only hide cursor on non-touch devices */
  @media (pointer: fine) {
    body { cursor: none; }
  }

  canvas#cosmos {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 0;
  }

  #veil {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 100%);
  }

  #wisdom {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    text-align: center;
    max-width: min(80vw, 700px);
    pointer-events: none;
    opacity: 0;
    transition: opacity 3s ease-in-out;
  }

  #wisdom.visible { opacity: 1; }

  #wisdom .text {
    color: rgba(220, 210, 190, 0.9);
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    font-weight: 300;
    line-height: 1.8;
    letter-spacing: 0.04em;
    text-shadow: 0 0 40px rgba(180, 160, 120, 0.15);
  }

  #wisdom .text .line {
    opacity: 0;
    transition: opacity 2.5s ease-in;
    display: block;
  }

  #wisdom .text .line.revealed {
    opacity: 1;
  }

  #wisdom .source {
    color: rgba(160, 145, 120, 0.5);
    font-size: clamp(0.7rem, 1.5vw, 0.9rem);
    font-style: italic;
    font-weight: 300;
    margin-top: 2em;
    letter-spacing: 0.12em;
    text-transform: lowercase;
  }

  #cursor-glow {
    position: fixed;
    width: 250px; height: 250px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 3;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(200, 180, 140, 0.05) 0%,
      rgba(200, 180, 140, 0.015) 40%,
      transparent 70%
    );
    mix-blend-mode: screen;
    transition: opacity 1.5s, width 1.5s, height 1.5s;
  }

  /* On touch devices, hide the cursor glow (we use touch-glow instead) */
  @media (pointer: coarse) {
    #cursor-glow { display: none; }
  }

  #breathe {
    position: fixed;
    bottom: 3vh;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    color: rgba(160, 145, 120, 0.25);
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: lowercase;
    pointer-events: none;
    opacity: 0;
    transition: opacity 3s ease-in-out;
  }

  #breathe.visible {
    opacity: 1;
    animation: breathe-text 8s ease-in-out infinite;
  }

  @keyframes breathe-text {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.4; }
  }

  #threshold {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 10;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
  }

  #threshold .enter-text {
    color: rgba(180, 165, 135, 0);
    font-size: clamp(0.8rem, 2vw, 1.1rem);
    letter-spacing: 0.25em;
    font-weight: 300;
    transition: color 4s ease-in, opacity 4s ease-in;
    cursor: pointer;
  }

  #threshold.text-visible .enter-text {
    color: rgba(180, 165, 135, 0.35);
    animation: pulse-soft 6s ease-in-out infinite;
  }

  #threshold.dissolving {
    pointer-events: none;
  }

  #threshold.dissolving .enter-text {
    opacity: 0;
    transition: opacity 1.5s ease-out;
  }

  #threshold-ring {
    position: fixed;
    border-radius: 50%;
    border: 1px solid rgba(180, 165, 135, 0.3);
    pointer-events: none;
    z-index: 11;
    opacity: 0;
  }

  @keyframes pulse-soft {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.55; }
  }
</style>
</head>
<body>

<div id="threshold">
  <span class="enter-text">enter the silence</span>
</div>
<div id="threshold-ring"></div>

<canvas id="cosmos"></canvas>
<div id="veil"></div>
<div id="wisdom">
  <div class="text" id="wisdom-text"></div>
  <div class="source" id="wisdom-source"></div>
</div>
<div id="cursor-glow"></div>
<div id="breathe">be still</div>

<script>
// ─── Generative Sound ───
// All sound is synthesized — no external files needed.

let audioCtx = null;
let droneGain = null;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Master gain
  const master = audioCtx.createGain();
  master.gain.value = 0;
  master.connect(audioCtx.destination);

  // Fade master in slowly
  master.gain.linearRampToValueAtTime(0, audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 8);

  droneGain = master;

  // Base drone — low fundamental
  const drone1 = audioCtx.createOscillator();
  drone1.type = 'sine';
  drone1.frequency.value = 55; // A1
  const d1Gain = audioCtx.createGain();
  d1Gain.gain.value = 0.12;
  drone1.connect(d1Gain);
  d1Gain.connect(master);
  drone1.start();

  // Second drone — perfect fifth above, detuned slightly
  const drone2 = audioCtx.createOscillator();
  drone2.type = 'sine';
  drone2.frequency.value = 82.5; // ~E2, slightly flat
  const d2Gain = audioCtx.createGain();
  d2Gain.gain.value = 0.06;
  drone2.connect(d2Gain);
  d2Gain.connect(master);
  drone2.start();

  // LFO for gentle breathing
  const lfo = audioCtx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.value = 0.06; // one breath every ~16 seconds
  const lfoGain = audioCtx.createGain();
  lfoGain.gain.value = 0.03;
  lfo.connect(lfoGain);
  lfoGain.connect(d1Gain.gain);
  lfo.start();

  // Occasional tones that fade in and out over the drone
  function spawnTone() {
    if (!audioCtx) return;
    const harmonics = [110, 165, 220, 330, 440, 528];
    const freq = harmonics[Math.random() * harmonics.length | 0];
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq + (Math.random() - 0.5) * 2;

    const env = audioCtx.createGain();
    env.gain.value = 0;
    const peakVol = 0.015 + Math.random() * 0.015;
    const now = audioCtx.currentTime;
    env.gain.setValueAtTime(0, now);
    env.gain.linearRampToValueAtTime(peakVol, now + 3);
    env.gain.linearRampToValueAtTime(0, now + 8 + Math.random() * 6);

    osc.connect(env);
    env.connect(master);
    osc.start(now);
    osc.stop(now + 15);

    // Next tone in 8-20 seconds
    setTimeout(spawnTone, (8000 + Math.random() * 12000) * timePace);
  }
  setTimeout(spawnTone, 3000);
}

function playBell() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;

  // Bell: sine with quick attack, long decay
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  osc.frequency.value = 528; // C5-ish, "healing" frequency

  const env = audioCtx.createGain();
  env.gain.value = 0;
  env.gain.linearRampToValueAtTime(0.08, now + 0.01);
  env.gain.exponentialRampToValueAtTime(0.001, now + 6);

  // Slight detune second partial
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = 528 * 2.01;
  const env2 = audioCtx.createGain();
  env2.gain.value = 0;
  env2.gain.linearRampToValueAtTime(0.03, now + 0.01);
  env2.gain.exponentialRampToValueAtTime(0.001, now + 4);

  osc.connect(env);
  osc2.connect(env2);
  env.connect(droneGain || audioCtx.destination);
  env2.connect(droneGain || audioCtx.destination);
  osc.start(now);
  osc2.start(now);
  osc.stop(now + 7);
  osc2.stop(now + 5);
}

// ─── Cosmos (star field & nebulae) ───

const canvas = document.getElementById('cosmos');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth * devicePixelRatio;
  H = canvas.height = window.innerHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  W /= devicePixelRatio;
  H /= devicePixelRatio;
}
window.addEventListener('resize', resize);
resize();

// Star color temperatures (warm to cool)
const starColors = [
  [255, 210, 160],  // warm yellow
  [255, 235, 220],  // white-warm
  [220, 225, 255],  // cool white
  [180, 200, 255],  // blue-white
  [160, 180, 255],  // cool blue
];

// Three parallax layers: far (slow, dim, many), mid, near (fast, bright, few)
const starLayers = [
  { count: 500, rMin: 0.15, rMax: 0.6,  drift: 0.02,  brightnessMax: 0.5 },
  { count: 200, rMin: 0.4,  rMax: 1.0,  drift: 0.06,  brightnessMax: 0.75 },
  { count: 60,  rMin: 0.8,  rMax: 1.5,  drift: 0.12,  brightnessMax: 1.0 },
];

const stars = [];
for (const layer of starLayers) {
  for (let i = 0; i < layer.count; i++) {
    const color = starColors[Math.random() * starColors.length | 0];
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      baseX: 0, baseY: 0, // for parallax offset
      r: Math.random() * (layer.rMax - layer.rMin) + layer.rMin,
      brightness: Math.random() * layer.brightnessMax,
      speed: Math.random() * 0.0003 + 0.0001,
      phase: Math.random() * Math.PI * 2,
      drift: layer.drift,
      color: color,
    });
    stars[stars.length - 1].baseX = stars[stars.length - 1].x;
    stars[stars.length - 1].baseY = stars[stars.length - 1].y;
  }
}

// Shooting stars
const shootingStars = [];
function maybeSpawnShootingStar() {
  if (Math.random() < 0.003 && shootingStars.length < 2) {
    shootingStars.push({
      x: Math.random() * W * 0.8 + W * 0.1,
      y: Math.random() * H * 0.4,
      vx: (2 + Math.random() * 3) * (Math.random() < 0.5 ? 1 : -1),
      vy: 1.5 + Math.random() * 2,
      life: 1.0,
      decay: 0.008 + Math.random() * 0.012,
      length: 30 + Math.random() * 50,
    });
  }
}

// Nebula clouds (soft radial gradient blobs that drift)
const nebulae = [];
for (let i = 0; i < 3; i++) {
  nebulae.push({
    x: Math.random() * W,
    y: Math.random() * H,
    radius: 150 + Math.random() * 250,
    vx: (Math.random() - 0.5) * 0.08,
    vy: (Math.random() - 0.5) * 0.05,
    // Blue-violet palette
    r: 15 + Math.random() * 20 | 0,
    g: 10 + Math.random() * 15 | 0,
    b: 40 + Math.random() * 40 | 0,
    alpha: 0.015 + Math.random() * 0.02,
    phase: Math.random() * Math.PI * 2,
  });
}

// Ripples from presence
const ripples = [];
let mouseX = W / 2, mouseY = H / 2;

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  document.getElementById('cursor-glow').style.left = mouseX + 'px';
  document.getElementById('cursor-glow').style.top = mouseY + 'px';
});

document.addEventListener('click', e => {
  if (document.getElementById('threshold').style.display !== 'none') return;
  ripples.push({ x: e.clientX, y: e.clientY, t: 0, maxR: 150 + Math.random() * 100 });
  playBell();
});

document.addEventListener('touchstart', e => {
  const touch = e.touches[0];
  ripples.push({ x: touch.clientX, y: touch.clientY, t: 0, maxR: 150 + Math.random() * 100 });
});

// ─── State ───

let lastMoveTime = Date.now();
let isStill = false;

// ─── Time-awareness ───
// The experience shifts with the hour. Late night is deepest.
const hour = new Date().getHours();
const isDeepNight = hour >= 0 && hour < 5;     // midnight-5am
const isDawn = hour >= 5 && hour < 7;           // 5-7am
const isDusk = hour >= 18 && hour < 21;         // 6-9pm
const isLateEvening = hour >= 21 || hour < 0;   // 9pm-midnight

// Multipliers applied to various systems
const timePace = isDeepNight ? 1.4 : isDawn ? 0.9 : isDusk ? 1.1 : isLateEvening ? 1.2 : 1.0;
const timeDarkness = isDeepNight ? 0.6 : isDawn ? 1.1 : isDusk ? 0.85 : 1.0;
const timeWarmth = isDawn ? 0.15 : isDusk ? 0.1 : 0; // warm edge for golden hours
let textParticles = []; // characters dissolving into stars

// ─── Render loop ───

let time = 0;
const startTime = Date.now();

function draw() {
  time++;
  const elapsed = (Date.now() - startTime) / 1000; // seconds since start
  const evolve = Math.min(elapsed / 1200, 1); // 0→1 over 20 minutes

  // Universal breath: 12-second cycle (6s in, 6s out)
  // sin gives -1 to 1, we map to ~0.92 to 1.08 — subtle, felt not seen
  const breathCycle = Math.sin(time * (Math.PI * 2) / (60 * 12)); // 12 sec at 60fps
  const breath = 1 + breathCycle * 0.08;

  ctx.globalCompositeOperation = 'source-over';

  // Clear to deep black
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Nebula clouds (drawn beneath stars)
  ctx.globalCompositeOperation = 'lighter';
  for (const n of nebulae) {
    n.x += n.vx;
    n.y += n.vy;
    // Wrap around edges
    if (n.x < -n.radius) n.x = W + n.radius;
    if (n.x > W + n.radius) n.x = -n.radius;
    if (n.y < -n.radius) n.y = H + n.radius;
    if (n.y > H + n.radius) n.y = -n.radius;

    const breathe = Math.sin(time * 0.005 + n.phase) * 0.3 + 1.0;
    const r = n.radius * breathe;
    const alpha = n.alpha * (1 + evolve * 0.5) * breath;
    const grd = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r);
    grd.addColorStop(0, `rgba(${n.r}, ${n.g}, ${n.b}, ${alpha})`);
    grd.addColorStop(0.5, `rgba(${n.r}, ${n.g}, ${n.b}, ${alpha * 0.3})`);
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.fillRect(n.x - r, n.y - r, r * 2, r * 2);
  }

  // Stars with parallax drift
  ctx.globalCompositeOperation = 'lighter';
  for (const s of stars) {
    // Slow drift
    s.x += s.drift * 0.02;
    if (s.x > W + 5) s.x = -5;

    // Parallax from mouse
    const px = (mouseX - W / 2) * s.drift * 0.005;
    const py = (mouseY - H / 2) * s.drift * 0.005;
    const sx = s.x + px;
    const sy = s.y + py;

    const flicker = Math.sin(time * s.speed * 60 + s.phase) * 0.35 + 0.65;
    const stillBonus = isStill ? 0.15 : 0;
    const alpha = (s.brightness * flicker * (0.7 + evolve * 0.3) + stillBonus) * timeDarkness * breath;

    // Proximity glow: stars brighten near cursor
    const dx = sx - mouseX, dy = sy - mouseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const proximity = dist < 200 ? (1 - dist / 200) * 0.4 : 0;

    const finalAlpha = Math.min(alpha + proximity, 1);
    const [cr, cg, cb] = s.color;

    ctx.beginPath();
    ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, ${finalAlpha})`;
    ctx.fill();

    // Glow halo on brighter/larger stars
    if (s.r > 0.8) {
      ctx.beginPath();
      ctx.arc(sx, sy, s.r * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${cr}, ${cg}, ${cb}, ${(finalAlpha * 0.06)})`;
      ctx.fill();
    }
  }

  // Shooting stars
  maybeSpawnShootingStar();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const ss = shootingStars[i];
    ss.life -= ss.decay;
    if (ss.life <= 0) { shootingStars.splice(i, 1); continue; }
    ss.x += ss.vx;
    ss.y += ss.vy;

    const tailX = ss.x - ss.vx * ss.length * 0.3;
    const tailY = ss.y - ss.vy * ss.length * 0.3;

    const grad = ctx.createLinearGradient(ss.x, ss.y, tailX, tailY);
    grad.addColorStop(0, `rgba(255, 250, 240, ${ss.life * 0.8})`);
    grad.addColorStop(1, `rgba(200, 200, 255, 0)`);
    ctx.beginPath();
    ctx.moveTo(ss.x, ss.y);
    ctx.lineTo(tailX, tailY);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Stillness constellation
  if (constellationParticles.length > 0) {
    ctx.globalCompositeOperation = 'lighter';
    let allDead = true;
    for (let i = 0; i < constellationParticles.length; i++) {
      const cp = constellationParticles[i];
      if (time < cp.born) { allDead = false; continue; }
      const age = (time - cp.born) / 60; // seconds-ish
      if (age < 8) {
        cp.alpha = age < 2 ? age / 2 : (age < 6 ? 1 : (8 - age) / 2);
        allDead = false;
      } else {
        cp.alpha = 0;
        continue;
      }
      // Star point
      ctx.beginPath();
      ctx.arc(cp.x, cp.y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220, 210, 190, ${cp.alpha * 0.7})`;
      ctx.fill();
      // Glow
      ctx.beginPath();
      ctx.arc(cp.x, cp.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 185, 150, ${cp.alpha * 0.08})`;
      ctx.fill();
      // Line to next point
      const next = constellationParticles[(i + 1) % constellationParticles.length];
      if (time >= next.born && next.alpha > 0) {
        const lineAlpha = Math.min(cp.alpha, next.alpha) * 0.15;
        ctx.beginPath();
        ctx.moveTo(cp.x, cp.y);
        ctx.lineTo(next.x, next.y);
        ctx.strokeStyle = `rgba(200, 185, 150, ${lineAlpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
    if (allDead) constellationParticles = [];
  }

  // Text particles (characters dissolving into stars)
  if (textParticles.length > 0) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = textParticles.length - 1; i >= 0; i--) {
      const p = textParticles[i];
      if (time - p.born < p.delay) continue;
      p.x += p.vx;
      p.y += p.vy;
      p.vy *= 0.998; // slow deceleration upward
      p.vx += (Math.random() - 0.5) * 0.02; // gentle wander
      p.life -= p.decay;
      if (p.life <= 0) { textParticles.splice(i, 1); continue; }
      const alpha = p.life * 0.8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(220, 210, 190, ${alpha})`;
      ctx.fill();
      if (p.r > 0.6) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(200, 185, 150, ${alpha * 0.06})`;
        ctx.fill();
      }
    }
  }

  // Ripples (multiple concentric rings)
  ctx.globalCompositeOperation = 'lighter';
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.t += 0.006;
    if (r.t >= 1) { ripples.splice(i, 1); continue; }
    // Draw 3 concentric rings
    for (let ring = 0; ring < 3; ring++) {
      const offset = ring * 0.08;
      const rt = r.t - offset;
      if (rt < 0 || rt > 1) continue;
      const radius = r.maxR * rt;
      const alpha = (1 - rt) * 0.04;
      ctx.beginPath();
      ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200, 185, 150, ${alpha})`;
      ctx.lineWidth = 0.8;
      ctx.stroke();
    }
  }

  // Gentle mouse-follow glow on canvas
  ctx.globalCompositeOperation = 'lighter';
  const grd = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 150);
  grd.addColorStop(0, 'rgba(180, 170, 140, 0.012)');
  grd.addColorStop(1, 'rgba(180, 170, 140, 0)');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // Breath vignette — the edges darken and lighten with the breath
  ctx.globalCompositeOperation = 'source-over';
  const vignetteAlpha = 0.25 + (1 - breath) * 0.15; // slightly darker on exhale
  const vigGrd = ctx.createRadialGradient(W / 2, H / 2, W * 0.25, W / 2, H / 2, W * 0.7);
  vigGrd.addColorStop(0, 'transparent');
  vigGrd.addColorStop(1, `rgba(0, 0, 0, ${vignetteAlpha})`);
  ctx.fillStyle = vigGrd;
  ctx.fillRect(0, 0, W, H);

  // Time-aware warm edge at dawn/dusk
  if (timeWarmth > 0) {
    ctx.globalCompositeOperation = 'lighter';
    const warmGrd = ctx.createRadialGradient(W / 2, H, 0, W / 2, H, H * 1.2);
    warmGrd.addColorStop(0, `rgba(180, 120, 60, ${timeWarmth})`);
    warmGrd.addColorStop(1, 'transparent');
    ctx.fillStyle = warmGrd;
    ctx.fillRect(0, 0, W, H);
  }

  requestAnimationFrame(draw);
}

// ─── Wisdom cycle ───

const wisdomEl = document.getElementById('wisdom');
const textEl = document.getElementById('wisdom-text');
const sourceEl = document.getElementById('wisdom-source');
let currentIndex = -1;
let wisdomQueue = [];

function shuffleQueue() {
  wisdomQueue = [...Array(fragments.length).keys()];
  // Fisher-Yates
  for (let i = wisdomQueue.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    [wisdomQueue[i], wisdomQueue[j]] = [wisdomQueue[j], wisdomQueue[i]];
  }
}

function dissolveTextToStars() {
  // Read positions of each visible character from the DOM
  const lineEls = textEl.querySelectorAll('.line');
  lineEls.forEach(lineEl => {
    const text = lineEl.textContent;
    const rect = lineEl.getBoundingClientRect();
    // Approximate character positions along the line
    if (!text.trim()) return;
    const charWidth = rect.width / text.length;
    for (let i = 0; i < text.length; i++) {
      if (text[i] === ' ') continue;
      const cx = rect.left + charWidth * (i + 0.5);
      const cy = rect.top + rect.height / 2;
      textParticles.push({
        x: cx,
        y: cy,
        vx: (Math.random() - 0.5) * 0.3,
        vy: -0.2 - Math.random() * 0.5,
        life: 1.0,
        decay: 0.002 + Math.random() * 0.003,
        r: 0.5 + Math.random() * 0.8,
        delay: Math.random() * 60, // stagger the start
        born: time,
      });
    }
  });
}

function showNextWisdom() {
  if (wisdomQueue.length === 0) shuffleQueue();
  const idx = wisdomQueue.pop();
  const frag = fragments[idx];

  wisdomEl.classList.remove('visible');

  setTimeout(() => {
    // Split into lines and wrap each
    const lines = frag.text.split('\n');
    textEl.innerHTML = lines.map(l => `<span class="line">${l}</span>`).join('');
    sourceEl.textContent = '— ' + frag.source;
    sourceEl.style.opacity = '0';
    sourceEl.style.transition = 'opacity 2.5s ease-in';

    setTimeout(() => {
      wisdomEl.classList.add('visible');

      // Reveal each line with a staggered delay
      const lineEls = textEl.querySelectorAll('.line');
      const lineDelay = 1800; // ms between each line
      lineEls.forEach((el, i) => {
        setTimeout(() => el.classList.add('revealed'), i * lineDelay);
      });

      // Reveal source after all lines
      const sourceDelay = lines.length * lineDelay + 1500;
      setTimeout(() => { sourceEl.style.opacity = '1'; }, sourceDelay);

      // Total display time: line reveals + 10-14s to contemplate
      const displayTime = sourceDelay + 10000 + Math.random() * 4000;
      setTimeout(() => {
        dissolveTextToStars();
        wisdomEl.classList.remove('visible');
        sourceEl.style.opacity = '0';
        // Longer silence between fragments (15-22s)
        setTimeout(showNextWisdom, (15000 + Math.random() * 7000) * timePace);
      }, displayTime);
    }, 800);
  }, 1000);
}

// ─── Threshold (entry) ───

// Pure darkness for 4 seconds, then text slowly appears
setTimeout(() => {
  document.getElementById('threshold').classList.add('text-visible');
}, 4000);

function crossThreshold(x, y) {
  const threshold = document.getElementById('threshold');
  if (threshold.classList.contains('dissolving')) return;
  threshold.classList.add('dissolving');

  // Start audio on user gesture (required by browsers)
  initAudio();
  playBell();

  // Expanding ring from click point
  const ring = document.getElementById('threshold-ring');
  const maxDim = Math.max(window.innerWidth, window.innerHeight) * 2.5;
  ring.style.left = (x - maxDim / 2) + 'px';
  ring.style.top = (y - maxDim / 2) + 'px';
  ring.style.width = '0px';
  ring.style.height = '0px';
  ring.style.opacity = '1';
  ring.style.transition = 'width 3.5s ease-out, height 3.5s ease-out, opacity 3.5s ease-out';

  requestAnimationFrame(() => {
    ring.style.width = maxDim + 'px';
    ring.style.height = maxDim + 'px';
    ring.style.opacity = '0';
  });

  // Fade the black background via clip-path (shrinking circle reveals cosmos)
  threshold.style.transition = 'opacity 3s ease-in';
  setTimeout(() => { threshold.style.opacity = '0'; }, 500);

  setTimeout(() => {
    threshold.style.display = 'none';
    ring.style.display = 'none';
    showNextWisdom();
  }, 3500);
}

document.getElementById('threshold').addEventListener('click', e => {
  crossThreshold(e.clientX, e.clientY);
});

document.getElementById('threshold').addEventListener('touchend', e => {
  e.preventDefault();
  const touch = e.changedTouches[0];
  crossThreshold(touch.clientX, touch.clientY);
});

// ─── Stillness Detection ───
// "be still" only appears when the user is restless (lots of movement)

let moveCount = 0;
let moveWindow = [];
const breatheEl = document.getElementById('breathe');
let breatheVisible = false;

document.addEventListener('mousemove', () => {
  moveWindow.push(Date.now());
});
document.addEventListener('touchmove', () => {
  moveWindow.push(Date.now());
});

setInterval(() => {
  const now = Date.now();
  // Count moves in the last 3 seconds
  moveWindow = moveWindow.filter(t => now - t < 3000);
  const isRestless = moveWindow.length > 60; // ~20 moves/sec = frantic

  if (isRestless && !breatheVisible) {
    breatheVisible = true;
    breatheEl.classList.add('visible');
  } else if (!isRestless && breatheVisible) {
    breatheVisible = false;
    breatheEl.classList.remove('visible');
  }
}, 1000);

// ─── Stillness reward: if cursor is still for 8+ seconds, stars breathe brighter ───
let deepStillnessTriggered = false;
let constellationParticles = [];

document.addEventListener('mousemove', () => { lastMoveTime = Date.now(); isStill = false; });
document.addEventListener('touchmove', () => { lastMoveTime = Date.now(); isStill = false; });

const stillnessWords = ['here', 'listen', 'breathe', 'now', 'home', 'stay', 'open', 'rest'];
let stillnessWordIndex = 0;

setInterval(() => {
  const stillDuration = Date.now() - lastMoveTime;
  if (stillDuration > 8000) {
    isStill = true;
  }

  // Deep stillness singularity: 2+ minutes of no movement
  if (stillDuration > 120000 && !deepStillnessTriggered) {
    deepStillnessTriggered = true;

    // Pick a random position on screen (away from edges)
    const cx = W * 0.15 + Math.random() * W * 0.7;
    const cy = H * 0.15 + Math.random() * H * 0.7;

    // A faint constellation draws itself at a random location
    const points = 5 + (Math.random() * 4 | 0);
    const constellationStars = [];
    for (let i = 0; i < points; i++) {
      const angle = (i / points) * Math.PI * 2 + Math.random() * 0.5;
      const dist = 40 + Math.random() * 80;
      constellationStars.push({
        x: cx + Math.cos(angle) * dist,
        y: cy + Math.sin(angle) * dist,
        born: time + i * 60, // staggered appearance
        alpha: 0,
      });
    }
    constellationParticles = constellationStars;

    // After the constellation, show a single word at a random position
    setTimeout(() => {
      const word = stillnessWords[stillnessWordIndex % stillnessWords.length];
      stillnessWordIndex++;

      // Position the wisdom element at a random spot
      const wx = 15 + Math.random() * 70; // 15-85% from left
      const wy = 15 + Math.random() * 70; // 15-85% from top
      wisdomEl.style.top = wy + '%';
      wisdomEl.style.left = wx + '%';

      textEl.innerHTML = `<span class="line">${word}</span>`;
      sourceEl.textContent = '';
      sourceEl.style.opacity = '0';
      wisdomEl.classList.add('visible');
      setTimeout(() => {
        textEl.querySelector('.line').classList.add('revealed');
      }, 500);
      setTimeout(() => {
        wisdomEl.classList.remove('visible');
        // Reset position back to center for normal fragments
        wisdomEl.style.top = '50%';
        wisdomEl.style.left = '50%';
      }, 6000);
    }, points * 1200 + 3000);

    // Allow retriggering after 5 more minutes of continued stillness
    setTimeout(() => { deepStillnessTriggered = false; }, 300000);
  }
}, 1000);

// ─── Begin ───
draw();
